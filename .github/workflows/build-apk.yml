name: Build APK

on:
  push:
    branches: [ "main", "arena/01a0bbba-mehrdad" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          GH_TOKEN: ${{ github.GITHUB_TOKEN }}
        run: |
          if ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1; then
            echo "BUILD_OK"
          else
            echo "BUILD FAILED — posting error tail as commit comment"
            body=$(printf '🚨 **CI build failed — gradle error tail:**\n\n```\n%s\n```' "$(tail -c 12000 build.log)")
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -f body="$body" --silent || true
            exit 1
          fi

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/wallet-finder-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallet-finder-debug-apk
          path: app/build/outputs/apk/debug/wallet-finder-debug.apk
          retention-days: 90
