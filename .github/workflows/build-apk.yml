name: Build APK

on:
  push:
    branches: [ "main", "arena/01a0bbba-mehrdad" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1; then
            tail -n 25 build.log
            echo "BUILD_OK"
          else
            echo "=== BUILD FAILED — compiler errors: ==="
            grep -E "^e: |^> |What went wrong" build.log | head -60
            echo "=== context ==="
            grep -B2 -A8 "What went wrong" build.log | head -40
            body=$(printf '🚨 **CI build failed — compiler errors:**\n\n```\n%s\n```' "$(grep -E '^e: |What went wrong' build.log | head -50)")
            gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -f body="$body" --silent || true
            exit 1
          fi

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/wallet-finder-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallet-finder-debug-apk
          path: app/build/outputs/apk/debug/wallet-finder-debug.apk
          retention-days: 90
